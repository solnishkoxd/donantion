<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Doações em Criptomoedas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            max-width: 700px;
            margin: auto;
            background-color: #fafafa;
        }
        h1 {
            text-align: center;
        }
        .card {
            background: white;
            padding: 20px;
            border: 1px solid #ddd;
            margin: 20px 0;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .card img {
            width: 60px;
        }
        .address {
            background: #f3f3f3;
            padding: 6px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <h1>Doe Criptomoedas 💛</h1>

    <!-- Bitcoin -->
    <div class="card">
        <img src="https://cryptologos.cc/logos/bitcoin-btc-logo.png?v=032" alt="Bitcoin Logo">
        <div>
            <h3>Bitcoin (BTC)</h3>
            <div class="address">12vakxzTpRzFgFq4qeDZTWSEz1zTNLMHs4</div>
        </div>
    </div>

    <!-- Solana -->
    <div class="card">
        <img src="https://cryptologos.cc/logos/solana-sol-logo.png?v=032" alt="Solana Logo">
        <div>
            <h3>Solana (SOL)</h3>
            <div class="address">4pYkSkDhN8PrP3guukETMnrsTGC49kS4gNCnjFEDWWxf</div>
        </div>
    </div>

</body>
</html>
